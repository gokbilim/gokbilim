backend:
  name: github
  repo: gokbilim/gokbilim
  branch: main
  base_url: https://decap-oauth.ozgucbayrak.workers.dev

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "haberler"
    label: "Haberler"
    folder: "src/content/haberler"
    create: true
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Tarih", name: "pubDate", widget: "datetime"}
      - {label: "Neden Önemli", name: "importance", widget: "text"}
      - {label: "Görsel", name: "image", widget: "image", required: false}
      - {label: "İçerik", name: "body", widget: "markdown"}

  - name: "gozlemevleri"
    label: "Türkiye'deki Gözlemevleri"
    folder: "src/content/gozlemevleri"
    create: true
    fields:
      - {label: "Gözlemevi Adı", name: "title", widget: "string"}
      - {label: "Şehir", name: "city", widget: "string"}
      - {label: "Görsel", name: "image", widget: "image", required: false}
      - {label: "İçerik", name: "body", widget: "markdown"}

  - name: "etkinlikler"
    label: "Gözlem Etkinlikleri"
    folder: "src/content/etkinlikler"
    create: true
    fields:
      - {label: "Etkinlik Adı", name: "title", widget: "string"}
      - {label: "Tarih", name: "eventDate", widget: "datetime"}
      - {label: "Görsel", name: "image", widget: "image", required: false}
      - {label: "İçerik", name: "body", widget: "markdown"}

  - name: "haftanin-fotografi"
    label: "Haftanın Fotoğrafı"
    folder: "src/content/fotograflar"
    create: true
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Fotoğraf", name: "image", widget: "image"}
      - {label: "Açıklama", name: "body", widget: "markdown"}

  - name: "tarih"
    label: "Gökbilim Tarihi"
    folder: "src/content/tarih"
    create: true
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Dönem/Yüzyıl", name: "period", widget: "string"}
      - {label: "Görsel", name: "image", widget: "image", required: false}
      - {label: "İçerik", name: "body", widget: "markdown"}

backend:
  name: github
  repo: gokbilim/gokbilim
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Yazıları"
    folder: "src/content/blog"
    create: true
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Açıklama", name: "description", widget: "string"}
      - {label: "Yayın Tarihi", name: "pubDate", widget: "datetime"}
      - {label: "Kapak Görseli", name: "heroImage", widget: "image", required: false}
      - {label: "İçerik", name: "body", widget: "markdown"}
